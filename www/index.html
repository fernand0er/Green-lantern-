<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anillo</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#010805; --glow:#2bff85; --muted:#6fae8b; --edge:#14563a;
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#010805; } }
:root[data-theme="dark"]{ --bg:#010805; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--muted);overflow:hidden;font-family:"Rajdhani",system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#aura{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:1rem}
#anillo{position:relative;width:min(66vw,300px);aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;border-radius:50%;touch-action:none}
#anillo:focus-visible{outline:2px solid var(--glow);outline-offset:10px}
#logo{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none;
  filter:grayscale(calc(1 - var(--lvl,0))) saturate(calc(.7 + var(--lvl,0)*.9)) brightness(calc(.4 + var(--lvl,0)*.85)) drop-shadow(0 0 calc(var(--lvl,0)*16px) #2bff85) drop-shadow(0 0 calc(var(--lvl,0)*40px) #2bff85)}
#hint{margin:0;font-size:1.05rem;min-height:1.3em;text-align:center;transition:opacity .6s}
#info{margin:0;font-size:.85rem;text-align:center;opacity:.85;font-variant-numeric:tabular-nums}
.acc{position:absolute;left:0;right:0;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
button.sec{background:rgba(1,8,5,.55);border:1px solid var(--edge);color:var(--muted);border-radius:999px;padding:.5rem 1.2rem;font:500 1rem "Rajdhani",sans-serif;cursor:pointer;touch-action:manipulation}
button.sec:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>

  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  function decay(){var n=Date.now(); st.level=Math.max(0,st.level-(n-st.t)/DAY*100); st.t=n;}
  function fmtDur(ms){var h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000); return h>0? h+" h "+m+" min" : m+" min";}

  var rings=[], accR=0;
  function spawn(R,lvl,dt){
    accR+=dt*(.2+1.0*lvl);
    while(accR>=1&&rings.length<6){ accR--; rings.push({life:0,max:2.4+Math.random()*.6}); }
  }
  function draw(now,dt,lvl){
    ctx.globalCompositeOperation="source-over"; ctx.clearRect(0,0,W,H);
    if(lvl<=0.004) { rings.length=0; return; }
    var rc=btn.getBoundingClientRect(), cx=rc.left+rc.width/2, cy=rc.top+rc.height/2, R=rc.width/2;
    ctx.globalCompositeOperation="lighter";
    var pulse=1+.07*Math.sin(now*2.2);
    var AR=R*(1.05+2.6*lvl)*(reduce?1:pulse);
    var g=ctx.createRadialGradient(cx,cy,R*.35,cx,cy,AR);
    g.addColorStop(0,"rgba(43,255,120,"+(.55*lvl)+")");
    g.addColorStop(.45,"rgba(30,220,100,"+(.28*lvl)+")");
    g.addColorStop(1,"rgba(20,180,80,0)");
    ctx.fillStyle=g; ctx.fillRect(cx-AR,cy-AR,AR*2,AR*2);
    if(reduce) return;
    var nb=6;
    for(var b=0;b<nb;b++){
      var ang=now*(.35+b*.07)*(b%2?-1:1)+b*1.05, wob=.5+.5*Math.sin(now*1.3+b*2.1);
      var dist=R*(.95+.35*wob), br=R*(.75+.55*wob)*(.6+.6*lvl);
      var bx=cx+Math.cos(ang)*dist, by=cy+Math.sin(ang)*dist;
      var bg=ctx.createRadialGradient(bx,by,0,bx,by,br);
      var ba=(.16+.14*wob)*lvl;
      bg.addColorStop(0,"rgba(70,255,150,"+ba+")"); bg.addColorStop(1,"rgba(43,255,120,0)");
      ctx.fillStyle=bg; ctx.fillRect(bx-br,by-br,br*2,br*2);
    }
    spawn(R,lvl,dt);
    var maxR=Math.max(W,H)*.55;
    for(var i=rings.length-1;i>=0;i--){
      var q=rings[i]; q.life+=dt; var k=q.life/q.max;
      if(k>=1){rings.splice(i,1);continue;}
      var rr=R+(maxR-R)*(1-Math.pow(1-k,2)), wd=R*.16+rr*.06;
      var rg=ctx.createRadialGradient(cx,cy,Math.max(0,rr-wd),cx,cy,rr+wd);
      var al=(1-k)*.5*lvl;
      rg.addColorStop(0,"rgba(43,255,120,0)"); rg.addColorStop(.5,"rgba(90,255,150,"+al+")"); rg.addColorStop(1,"rgba(43,255,120,0)");
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(cx,cy,rr+wd,0,Math.PI*2); ctx.fill();
    }
  }
  var infoT=0;
  function frame(now){
    var dt=Math.min(.1,(now-last)/1000); last=now;
    decay();
    if(holding){ st.level=Math.min(100,st.level+dt*40); st.last=Date.now();
      if(st.level>=100&&!wasFull){wasFull=true; if(navigator.vibrate){try{navigator.vibrate([50,40,110]);}catch(e){}}} }
    shown+=(st.level/100-shown)*Math.min(1,dt*(holding?3:1.5));
    document.documentElement.style.setProperty("--lvl",shown.toFixed(3));
    hint.style.opacity=shown>.05?0:1;
    infoT+=dt;
    if(infoT>.5){ infoT=0;
      dura.textContent=st.level>0? fmtDur(st.level/100*DAY):"—";
      ultima.textContent=st.last? new Date(st.last).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}):"—";
    }
    draw(now/1000,dt,shown);
    requestAnimationFrame(frame);
  }
  function start(e){ if(e)e.preventDefault(); if(holding)return; holding=true; wasFull=st.level>=100; if(navigator.vibrate){try{navigator.vibrate(15);}catch(x){}} }
  function stop(){ if(!holding)return; holding=false; save(); }
  btn.addEventListener("pointerdown",start);
  addEventListener("pointerup",stop); addEventListener("pointercancel",stop);
  btn.addEventListener("contextmenu",function(e){e.preventDefault();});
  btn.addEventListener("keydown",function(e){if((e.key===" "||e.key==="Enter")&&!e.repeat)start(e);});
  btn.addEventListener("keyup",function(e){if(e.key===" "||e.key==="Enter")stop();});
  $("vaciar").addEventListener("click",function(){ st={level:0,t:Date.now(),last:0}; save(); infoT=1; });
  setInterval(function(){ if(!holding) save(); },30000);
  requestAnimationFrame(frame);
})();
</script>
</body>
